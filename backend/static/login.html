<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bee Backend Login</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --danger:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:var(--card); border-radius:0.75rem; padding:2rem; width:100%; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
    h1 { margin:0 0 0.25rem; font-size:1.5rem; }
    p.muted { color:var(--muted); margin:0 0 1.5rem; }
    label { display:block; margin:1rem 0 0.25rem; color:var(--muted); font-size:0.875rem; }
    input, button { font:inherit; width:100%; padding:0.6rem 0.75rem; border-radius:0.375rem; border:1px solid #475569; background:#0f172a; color:var(--text); }
    button { background:var(--accent); color:#0f172a; border:none; font-weight:600; cursor:pointer; margin-top:1.25rem; }
    button:hover { opacity:0.9; }
    .error { color:var(--danger); font-size:0.875rem; margin-top:0.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐝 Bee Backend</h1>
    <p class="muted">Login to access the dashboard</p>
    <form method="post" action="/api/v1/login">
      <label for="username">Username</label>
      <input id="username" name="username" placeholder="Username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" required>
      <div id="error" class="error" style="display:none;"></div>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('error');
      el.textContent = error;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
